site_name: docker ephemeral
site_description: Use Docker without piling up garbage.
site_url: https://wendersoon.github.io/docker-ephemeral/
repo_url: https://github.com/wendersoon/docker-ephemeral
repo_name: wendersoon/docker-ephemeral
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Wenderson Melo &mdash; MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins: []

exclude_docs: |
  requirements.txt

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wendersoon/docker-ephemeral

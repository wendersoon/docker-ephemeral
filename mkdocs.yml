site_name: docker ephemeral
site_description: Docker CLI plugin that runs containers and Compose projects without leaving anything behind.
site_url: https://wendersoon.github.io/docker-ephemeral/
repo_url: https://github.com/wendersoon/docker-ephemeral
repo_name: wendersoon/docker-ephemeral
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Wenderson Melo &mdash; MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Usage: usage.md
  - How it works: how-it-works.md
  - Commands: commands.md
  - FAQ: faq.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.superfences

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wendersoon/docker-ephemeral
